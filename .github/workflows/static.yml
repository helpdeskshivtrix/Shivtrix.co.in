# Deploy Shivtrix.co.in (static site) to GitHub Pages
# Place at: .github/workflows/static.yml
name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Publish only the public site files (not node_modules, lockfiles,
      # PM2 config, .github, trickle notes, etc.)
      - name: Prepare site
        run: |
          mkdir _site
          cp *.html *.js *.json *.png *.ico _site/
          cp -r components icons trickle _site/
          rm -f _site/package.json _site/package-lock.json _site/ecosystem.config.js
          echo "shivtrix.co.in" > _site/CNAME
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

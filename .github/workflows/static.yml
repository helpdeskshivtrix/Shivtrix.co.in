# Deploy Shivtrix.co.in (static site) to GitHub Pages
name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Publish the whole site (html, css, js, images, icons, webp) and
      # leave out repo/dev files
      - name: Prepare site
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git*' --exclude='_site' --exclude='node_modules' \
            --exclude='package.json' --exclude='package-lock.json' \
            --exclude='ecosystem.config.js' --exclude='*.md' \
            ./ _site/
          echo "shivtrix.co.in" > _site/CNAME
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
